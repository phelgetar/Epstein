<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epstein DOJ Files — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --paper: #FAF8F3;
            --ink-dark: #1A1512;
            --ink-medium: #463E3A;
            --ink-light: #8A817C;
            --accent: #C1440E;
            --accent-muted: #D4774E;
            --border: #E0D9CF;
            --highlight: #FFF4E6;
            --shadow: rgba(26, 21, 18, 0.08);
            --green: #2d6a4f;
            --yellow: #b08800;
            --red: #a4161a;
        }

        body {
            font-family: 'Crimson Pro', Georgia, serif;
            background: var(--paper);
            color: var(--ink-dark);
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(26, 21, 18, 0.01) 2px, rgba(26, 21, 18, 0.01) 4px);
            pointer-events: none;
            z-index: -1;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem 3rem; }

        header {
            border-bottom: 3px solid var(--ink-dark);
            padding: 3rem 0 2rem;
            margin-bottom: 2rem;
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: -6px; left: 0; width: 100%; height: 1px;
            background: var(--accent);
        }
        h1 { font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-bottom: 0.5rem; }
        .subtitle { font-size: 1.25rem; color: var(--ink-medium); font-weight: 400; letter-spacing: 0.02em; }

        .nav-links { display: flex; gap: 0.5rem; }
        .nav-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--accent);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.5rem 1rem;
            border: 2px solid var(--accent);
            transition: all 0.2s ease;
        }
        .nav-link:hover { background: var(--accent); color: white; }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--ink-dark);
            margin-bottom: 2rem;
            gap: 0;
        }
        .tab {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s ease;
        }
        .tab:hover { color: var(--ink-dark); }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 500;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Command Cards */
        .commands-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .command-card {
            background: white;
            border: 2px solid var(--ink-dark);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .command-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--highlight);
            cursor: pointer;
            user-select: none;
        }
        .command-header:hover { background: #FFF0D6; }

        .command-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 500;
            color: var(--ink-dark);
        }

        .command-desc {
            font-size: 0.95rem;
            color: var(--ink-light);
            margin-left: 1rem;
        }

        .command-toggle {
            font-size: 1.2rem;
            color: var(--ink-light);
            transition: transform 0.2s ease;
        }
        .command-card.expanded .command-toggle { transform: rotate(180deg); }

        .command-body {
            padding: 1.5rem;
            display: none;
        }
        .command-card.expanded .command-body { display: block; }

        /* Argument rows */
        .args-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .arg-group { display: flex; flex-direction: column; gap: 0.25rem; }

        .arg-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--ink-medium);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .arg-label .type-badge {
            font-size: 0.65rem;
            padding: 0.1rem 0.35rem;
            border-radius: 3px;
            background: var(--border);
            color: var(--ink-light);
        }

        .arg-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            background: white;
            color: var(--ink-dark);
            transition: border-color 0.2s ease;
        }
        .arg-input:focus { outline: none; border-color: var(--accent); }

        .arg-input[type="number"] { width: 100%; }

        .arg-help {
            font-size: 0.8rem;
            color: var(--ink-light);
            font-style: italic;
        }

        /* Toggle switches for boolean flags */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.4rem 0;
        }

        .toggle {
            position: relative;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--border);
            border-radius: 11px;
            transition: 0.2s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 16px; width: 16px;
            left: 3px; bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        .toggle input:checked + .toggle-slider { background: var(--accent); }
        .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

        /* Command preview and actions */
        .command-preview {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 0.75rem 1rem;
            background: var(--ink-dark);
            color: #e0d9cf;
            border: none;
            margin-bottom: 1rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .command-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 0.6rem 1.5rem;
            border: 2px solid var(--ink-dark);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s ease;
        }

        .btn-run {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .btn-run:hover { background: #a63a0a; }
        .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-stop {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }
        .btn-stop:hover { background: #8b1318; }

        .btn-copy {
            background: white;
            color: var(--ink-dark);
        }
        .btn-copy:hover { background: var(--highlight); }

        .run-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--ink-light);
        }
        .run-status.running { color: var(--yellow); }
        .run-status.success { color: var(--green); }
        .run-status.error { color: var(--red); }

        /* Output console */
        .command-output {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            padding: 1rem;
            background: #1a1512;
            color: #c8c0b8;
            max-height: 400px;
            overflow-y: auto;
            display: none;
            margin-top: 1rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .command-output.visible { display: block; }

        /* Log Viewer (embedded) */
        .log-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .log-control-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .log-control-group label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .log-control-group input,
        .log-control-group select {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border);
            background: white;
            color: var(--ink-dark);
        }
        .log-control-group input:focus,
        .log-control-group select:focus { outline: none; border-color: var(--accent); }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .log-table th {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.5rem 0.75rem;
            text-align: left;
            border-bottom: 2px solid var(--ink-dark);
            color: var(--ink-medium);
            position: sticky;
            top: 0;
            background: var(--paper);
        }
        .log-table td {
            padding: 0.4rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            vertical-align: top;
        }
        .log-table tr:hover td { background: var(--highlight); }

        .log-level {
            display: inline-block;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        .log-level.INFO { background: #d8f3dc; color: var(--green); }
        .log-level.WARNING { background: #fff3cd; color: var(--yellow); }
        .log-level.ERROR, .log-level.CRITICAL { background: #f8d7da; color: var(--red); }
        .log-level.DEBUG { background: #e8e8e8; color: #666; }

        .log-data {
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        .log-data.expanded {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-pagination {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
        .log-pagination button {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
        }
        .log-pagination button:hover { border-color: var(--accent); }
        .log-pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

        .log-stats {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--ink-light);
            flex-wrap: wrap;
        }
        .log-stat-badge {
            padding: 0.3rem 0.6rem;
            border: 1px solid var(--border);
            background: white;
        }

        /* Command description paragraph */
        .command-description {
            font-size: 0.95rem;
            color: var(--ink-medium);
            line-height: 1.7;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        /* Rendered markdown in README tab */
        .readme-body {
            background: white;
            border: 2px solid var(--ink-dark);
            box-shadow: 4px 4px 0 var(--shadow);
            padding: 2rem 2.5rem;
            font-size: 1.05rem;
            line-height: 1.7;
        }
        .readme-body h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--ink-dark);
        }
        .readme-body h1:first-child { margin-top: 0; }
        .readme-body h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1.75rem 0 0.75rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid var(--border);
            color: var(--accent);
        }
        .readme-body h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 1.5rem 0 0.5rem;
        }
        .readme-body p { margin: 0.75rem 0; }
        .readme-body ul, .readme-body ol {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
        }
        .readme-body li { margin: 0.3rem 0; }
        .readme-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            background: var(--highlight);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
        }
        .readme-body pre {
            background: var(--ink-dark);
            color: #e0d9cf;
            padding: 1rem 1.25rem;
            overflow-x: auto;
            margin: 1rem 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .readme-body pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: inherit;
        }
        .readme-body a {
            color: var(--accent);
            text-decoration: underline;
        }
        .readme-body a:hover { color: var(--accent-muted); }
        .readme-body strong { font-weight: 700; }
        .readme-body em { font-style: italic; }
        .readme-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }
        .readme-body table {
            border-collapse: collapse;
            margin: 1rem 0;
            width: 100%;
            font-size: 0.9rem;
        }
        .readme-body th, .readme-body td {
            border: 1px solid var(--border);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        .readme-body th {
            background: var(--highlight);
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
        .readme-body blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            color: var(--ink-medium);
            margin: 1rem 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .container { padding: 0 1rem 2rem; }
            .args-grid { grid-template-columns: 1fr; }
            .tabs { overflow-x: auto; }
            .tab { padding: 0.5rem 1rem; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem;">
                <div>
                    <h1>Dashboard</h1>
                    <p class="subtitle">Server Management & Operations</p>
                </div>
                <div class="nav-links">
                    <a href="search.html" class="nav-link">Search</a>
                    <a href="gallery.html" class="nav-link">Gallery</a>
                </div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="commands">Commands</button>
            <button class="tab" data-tab="logs">Logs</button>
            <button class="tab" data-tab="readme">Readme</button>
        </div>

        <!-- ─── Commands Tab ─── -->
        <div id="tab-commands" class="tab-content active">
            <div class="commands-grid" id="commandsGrid"></div>
        </div>

        <!-- ─── Logs Tab ─── -->
        <div id="tab-logs" class="tab-content">
            <div class="log-stats" id="logStats"></div>
            <div class="log-controls">
                <div class="log-control-group" style="flex:1;min-width:200px;">
                    <label>Search</label>
                    <input type="text" id="logSearch" placeholder="Search logs...">
                </div>
                <div class="log-control-group">
                    <label>Level</label>
                    <select id="logLevel">
                        <option value="">All</option>
                        <option value="DEBUG">Debug</option>
                        <option value="INFO">Info</option>
                        <option value="WARNING">Warning</option>
                        <option value="ERROR">Error</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>
                <div class="log-control-group">
                    <label>Module</label>
                    <select id="logModule">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="log-control-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-copy" onclick="loadLogs()">Refresh</button>
                </div>
            </div>
            <div style="overflow-x:auto;">
                <table class="log-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Level</th>
                            <th>Module</th>
                            <th>Event</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="logBody"></tbody>
                </table>
            </div>
            <div class="log-pagination" id="logPagination"></div>
        </div>

        <!-- ─── Readme Tab ─── -->
        <div id="tab-readme" class="tab-content">
            <div id="readmeContent" class="readme-body" style="color:var(--ink-light);font-style:italic;">Loading README...</div>
        </div>
    </div>

<script>
// ─── Base path detection ─────────────────────────────────────
const BASE = (() => {
    const p = window.location.pathname;
    const i = p.indexOf('/static/');
    return i > 0 ? p.substring(0, i) : '';
})();

// ─── Command Definitions ─────────────────────────────────────
const COMMANDS = [
    {
        id: 'downloader',
        name: 'src.downloader',
        desc: 'PDF Downloader',
        description: 'Playwright-based PDF downloader that scrapes justice.gov disclosure pages. Uses stealth patches (playwright-stealth) to bypass Akamai CDN bot detection. Navigates paginated dataset pages in configurable batches, extracts PDF links, and downloads them with multithreaded workers. Files are saved to epstein_doj_files/data-set-N/. Only errors and new downloads are printed; the final summary includes per-dataset failure counts.',
        args: [
            { name: '--dataset', type: 'text', help: 'One or more dataset numbers separated by spaces. Defaults to all DOJ datasets (1-12) if omitted. Example: "1 3 5" downloads only those three datasets.', placeholder: '1 3 5' },
            { name: '--workers', type: 'number', help: 'Number of concurrent download threads. Default is 10. Higher values speed up downloads but increase server load and risk rate-limiting.', placeholder: '10' },
            { name: '--batch-size', type: 'number', help: 'Number of paginated pages to scan per batch before downloading discovered PDFs. Default is 10. Larger batches discover more links before downloading starts.', placeholder: '10' },
            { name: '--dry-run', type: 'flag', help: 'Crawl all dataset pages and count PDF links without actually downloading any files. Useful for estimating total file counts before committing to a full download.' },
            { name: '--headless', type: 'flag', help: 'Run the Chromium browser in headless mode (no visible window). Note: only the initial page-zero navigation uses the browser; subsequent pages use direct HTTP requests.' },
        ]
    },
    {
        id: 'gdrive_downloader',
        name: 'src.gdrive_downloader',
        desc: 'Google Drive Downloader',
        description: 'Downloads files from a shared Google Drive folder using the internal Drive API (no authentication required). Bypasses the normal 50-file listing cap by using the batchexecute RPC endpoint for complete file enumeration. The shared folder contains ~33,655 files across IMAGES (12 subfolders of scanned JPG/TIF document images) and NATIVES (4 subfolders of MP4 video and WAV audio). Automatically handles Google\'s virus-scan confirmation dialog for large file downloads. API keys are auto-discovered if the embedded key rotates.',
        args: [
            { name: '--folder', type: 'text', help: 'Restrict download to a specific top-level folder name, e.g. "IMAGES" or "NATIVES". If omitted, downloads everything from all top-level folders.', placeholder: 'IMAGES' },
            { name: '--workers', type: 'number', help: 'Number of concurrent download threads. Default is 5. Google Drive may rate-limit aggressive parallelism, so moderate values are recommended.', placeholder: '5' },
            { name: '--delay', type: 'number', help: 'Delay in seconds between consecutive downloads. Default is 0. Use values like 0.5 to avoid triggering Google Drive rate limits on large batches.', placeholder: '0', step: '0.1' },
            { name: '--dry-run', type: 'flag', help: 'List all folders and their file counts without downloading anything. Useful for previewing the folder structure and estimating download scope.' },
            { name: '--verbose', type: 'flag', help: 'Print individual file names as they are listed from the Drive API. Without this flag, only folder-level summaries are shown.' },
        ]
    },
    {
        id: 'extractor',
        name: 'src.extractor',
        desc: 'PDF to JSON Converter',
        description: 'Extracts full text from all downloaded PDFs using Poppler\'s pdftotext and pdfinfo command-line tools. Produces page-level text with form-feed delimiters and character offsets, enabling page-number references in search results. Outputs multiple JSON files to data/: a full extraction (with all text), a summary (with text previews), a flat search index, and a file listing. Requires Poppler to be installed (brew install poppler on macOS).',
        args: []
    },
    {
        id: 'build_index',
        name: 'src.build_index',
        desc: 'Build SQLite FTS5 Index',
        description: 'Creates a SQLite FTS5 full-text search index from the extracted JSON data. The FTS5 index enables fast, low-memory search queries with ranking, and is the preferred search backend for the web server (falls back to loading the full JSON into memory if no SQLite index exists). The index is saved to data/epstein_search.db.',
        args: [
            { name: '--force', type: 'flag', help: 'Delete and rebuild the SQLite index from scratch, even if the database file already exists. Without this flag, the command skips building if the index is already present.' },
        ]
    },
    {
        id: 'thumbnails',
        name: 'src.thumbnails',
        desc: 'Thumbnail Generator',
        description: 'Generates JPEG thumbnails for all datasets. Renders PDF pages using PyMuPDF (fitz), resizes JPG/TIF images using Pillow, and skips media files (MP4/WAV). Output is organized per dataset in data/thumbnails/data-set-N/. Datasets 1-12 are DOJ PDFs, 13-24 are Google Drive image scans, 25-28 are media (skipped). By default, existing thumbnails are skipped for fast incremental runs.',
        args: [
            { name: '--dataset', type: 'text', help: 'Dataset number(s) to process, space-separated. Defaults to all datasets (1-28). Example: "1 3 5" or "13 14 15" for Google Drive image datasets.', placeholder: '1 3 5' },

// ─── Active processes ────────────────────────────────────────
const activeProcesses = {};  // id -> { polling interval }

// ─── Render Commands ─────────────────────────────────────────
function renderCommands() {
    const grid = document.getElementById('commandsGrid');
    grid.innerHTML = COMMANDS.map(cmd => {
        const argsHtml = cmd.args.map(arg => {
            if (arg.type === 'flag') {
                return `
                    <div class="toggle-row">
                        <label class="toggle">
                            <input type="checkbox" data-cmd="${cmd.id}" data-arg="${arg.name}">
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="arg-label">${arg.name}</span>
                        <span class="arg-help">${arg.help}</span>
                    </div>`;
            } else if (arg.type === 'select') {
                const opts = arg.choices.map(c =>
                    `<option value="${c}">${c || '(none)'}</option>`
                ).join('');
                return `
                    <div class="arg-group">
                        <label class="arg-label">${arg.name} <span class="type-badge">choice</span></label>
                        <select class="arg-input" data-cmd="${cmd.id}" data-arg="${arg.name}">
                            ${opts}
                        </select>
                        <span class="arg-help">${arg.help}</span>
                    </div>`;
            } else {
                const inputType = arg.type === 'number' ? 'number' : 'text';
                const step = arg.step ? `step="${arg.step}"` : '';
                return `
                    <div class="arg-group">
                        <label class="arg-label">${arg.positional ? arg.name : arg.name} <span class="type-badge">${arg.type}</span></label>
                        <input type="${inputType}" class="arg-input" data-cmd="${cmd.id}" data-arg="${arg.name}"
                            placeholder="${arg.placeholder || ''}" ${step}>
                        <span class="arg-help">${arg.help}</span>
                    </div>`;
            }
        }).join('');

        // Separate flags from inputs
        const flags = cmd.args.filter(a => a.type === 'flag');
        const inputs = cmd.args.filter(a => a.type !== 'flag');

        const inputsHtml = inputs.map(arg => {
            if (arg.type === 'select') {
                const opts = arg.choices.map(c =>
                    `<option value="${c}">${c || '(none)'}</option>`
                ).join('');
                return `
                    <div class="arg-group">
                        <label class="arg-label">${arg.name} <span class="type-badge">choice</span></label>
                        <select class="arg-input" data-cmd="${cmd.id}" data-arg="${arg.name}">
                            ${opts}
                        </select>
                        <span class="arg-help">${arg.help}</span>
                    </div>`;
            }
            const inputType = arg.type === 'number' ? 'number' : 'text';
            const step = arg.step ? `step="${arg.step}"` : '';
            return `
                <div class="arg-group">
                    <label class="arg-label">${arg.name} <span class="type-badge">${arg.type}</span></label>
                    <input type="${inputType}" class="arg-input" data-cmd="${cmd.id}" data-arg="${arg.name}"
                        placeholder="${arg.placeholder || ''}" ${step}>
                    <span class="arg-help">${arg.help}</span>
                </div>`;
        }).join('');

        const flagsHtml = flags.map(arg => `
            <div class="toggle-row">
                <label class="toggle">
                    <input type="checkbox" data-cmd="${cmd.id}" data-arg="${arg.name}">
                    <span class="toggle-slider"></span>
                </label>
                <span class="arg-label">${arg.name}</span>
                <span class="arg-help">${arg.help}</span>
            </div>`
        ).join('');

        return `
            <div class="command-card" id="card-${cmd.id}">
                <div class="command-header" onclick="toggleCard('${cmd.id}')">
                    <div>
                        <span class="command-name">python -m ${cmd.name}</span>
                        <span class="command-desc">${cmd.desc}</span>
                    </div>
                    <span class="command-toggle">&#9662;</span>
                </div>
                <div class="command-body">
                    ${cmd.description ? `<p class="command-description">${cmd.description}</p>` : ''}
                    ${inputs.length ? `<div class="args-grid">${inputsHtml}</div>` : ''}
                    ${flags.length ? `<div style="margin-bottom:1rem;">${flagsHtml}</div>` : ''}
                    ${cmd.args.length === 0 ? '<p style="color:var(--ink-light);font-style:italic;margin-bottom:1rem;">No arguments — runs with defaults</p>' : ''}
                    <div class="command-preview" id="preview-${cmd.id}">python -m ${cmd.name}</div>
                    <div class="command-actions">
                        <button class="btn btn-run" id="run-${cmd.id}" onclick="runCommand('${cmd.id}')">Run</button>
                        <button class="btn btn-stop" id="stop-${cmd.id}" onclick="stopCommand('${cmd.id}')" style="display:none;">Stop</button>
                        <button class="btn btn-copy" onclick="copyCommand('${cmd.id}')">Copy</button>
                        <span class="run-status" id="status-${cmd.id}"></span>
                    </div>
                    <div class="command-output" id="output-${cmd.id}"></div>
                </div>
            </div>`;
    }).join('');

    // Add event listeners for live preview
    document.querySelectorAll('[data-cmd]').forEach(el => {
        el.addEventListener('change', () => updatePreview(el.dataset.cmd));
        el.addEventListener('input', () => updatePreview(el.dataset.cmd));
    });
}

function toggleCard(id) {
    document.getElementById('card-' + id).classList.toggle('expanded');
}

function buildCommandString(id) {
    const cmd = COMMANDS.find(c => c.id === id);
    let parts = ['python', '-m', cmd.name];

    cmd.args.forEach(arg => {
        const el = document.querySelector(`[data-cmd="${id}"][data-arg="${arg.name}"]`);
        if (!el) return;

        if (arg.type === 'flag') {
            if (el.checked) parts.push(arg.name);
        } else if (arg.type === 'select') {
            if (el.value) parts.push(arg.name, el.value);
        } else {
            const val = el.value.trim();
            if (val) {
                if (arg.positional) {
                    parts.push(val);
                } else {
                    parts.push(arg.name, val);
                }
            }
        }
    });

    return parts.join(' ');
}

function updatePreview(id) {
    const preview = document.getElementById('preview-' + id);
    preview.textContent = buildCommandString(id);
}

function copyCommand(id) {
    const text = buildCommandString(id);
    navigator.clipboard.writeText(text);
    const btn = document.querySelector(`#card-${id} .btn-copy`);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
}

// ─── Run / Stop Commands ─────────────────────────────────────
async function runCommand(id) {
    const cmdStr = buildCommandString(id);
    const runBtn = document.getElementById('run-' + id);
    const stopBtn = document.getElementById('stop-' + id);
    const status = document.getElementById('status-' + id);
    const output = document.getElementById('output-' + id);

    runBtn.disabled = true;
    stopBtn.style.display = '';
    status.textContent = 'Starting...';
    status.className = 'run-status running';
    output.textContent = '';
    output.classList.add('visible');

    try {
        const res = await fetch(`${BASE}/api/dashboard/run`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ command: cmdStr }),
        });
        const data = await res.json();

        if (!res.ok) {
            status.textContent = 'Error: ' + (data.error || res.statusText);
            status.className = 'run-status error';
            runBtn.disabled = false;
            stopBtn.style.display = 'none';
            return;
        }

        const pid = data.pid;
        status.textContent = `Running (PID ${pid})`;
        activeProcesses[id] = pid;

        // Poll for output
        const poll = setInterval(async () => {
            try {
                const r = await fetch(`${BASE}/api/dashboard/output/${pid}`);
                const d = await r.json();
                output.textContent = d.output || '';
                output.scrollTop = output.scrollHeight;

                if (d.status === 'finished' || d.status === 'error' || d.status === 'stopped') {
                    clearInterval(poll);
                    delete activeProcesses[id];
                    runBtn.disabled = false;
                    stopBtn.style.display = 'none';

                    if (d.status === 'error' || d.return_code !== 0) {
                        status.textContent = `Exited (code ${d.return_code})`;
                        status.className = 'run-status error';
                    } else {
                        status.textContent = 'Completed';
                        status.className = 'run-status success';
                    }
                }
            } catch (e) {
                clearInterval(poll);
                delete activeProcesses[id];
                runBtn.disabled = false;
                stopBtn.style.display = 'none';
                status.textContent = 'Poll error';
                status.className = 'run-status error';
            }
        }, 1000);
    } catch (e) {
        status.textContent = 'Failed: ' + e.message;
        status.className = 'run-status error';
        runBtn.disabled = false;
        stopBtn.style.display = 'none';
    }
}

async function stopCommand(id) {
    const pid = activeProcesses[id];
    if (!pid) return;
    try {
        await fetch(`${BASE}/api/dashboard/stop/${pid}`, { method: 'POST' });
        document.getElementById('status-' + id).textContent = 'Stopping...';
    } catch (e) {
        console.error('Stop error:', e);
    }
}

// ─── Markdown Renderer ───────────────────────────────────────
function renderMarkdown(md) {
    // Normalize line endings
    md = md.replace(/\r\n/g, '\n');

    // Extract code blocks first to protect them from other processing
    const codeBlocks = [];
    md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        codeBlocks.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
        return `\x00CODEBLOCK${codeBlocks.length - 1}\x00`;
    });

    // Extract inline code
    const inlineCodes = [];
    md = md.replace(/`([^`\n]+)`/g, (_, code) => {
        inlineCodes.push(`<code>${escapeHtml(code)}</code>`);
        return `\x00INLINE${inlineCodes.length - 1}\x00`;
    });

    // Tables
    md = md.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)*)/gm, (_, header, sep, body) => {
        const ths = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
        const rows = body.trim().split('\n').map(row => {
            const tds = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
            return `<tr>${tds}</tr>`;
        }).join('');
        return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>\n`;
    });

    // Process line by line
    const lines = md.split('\n');
    let html = '';
    let inList = false;
    let listType = '';
    let inParagraph = false;

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Code block placeholder
        const cbMatch = line.match(/^\x00CODEBLOCK(\d+)\x00$/);
        if (cbMatch) {
            if (inList) { html += `</${listType}>`; inList = false; }
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            html += codeBlocks[parseInt(cbMatch[1])];
            continue;
        }

        // Headings
        const hMatch = line.match(/^(#{1,6})\s+(.+)$/);
        if (hMatch) {
            if (inList) { html += `</${listType}>`; inList = false; }
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            const level = hMatch[1].length;
            html += `<h${level}>${inlineFormat(hMatch[2])}</h${level}>`;
            continue;
        }

        // Horizontal rule
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(line.trim())) {
            if (inList) { html += `</${listType}>`; inList = false; }
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            html += '<hr>';
            continue;
        }

        // Unordered list
        const ulMatch = line.match(/^(\s*)[-*+]\s+(.+)$/);
        if (ulMatch) {
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            if (!inList || listType !== 'ul') {
                if (inList) html += `</${listType}>`;
                html += '<ul>';
                inList = true;
                listType = 'ul';
            }
            html += `<li>${inlineFormat(ulMatch[2])}</li>`;
            continue;
        }

        // Ordered list
        const olMatch = line.match(/^(\s*)\d+\.\s+(.+)$/);
        if (olMatch) {
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            if (!inList || listType !== 'ol') {
                if (inList) html += `</${listType}>`;
                html += '<ol>';
                inList = true;
                listType = 'ol';
            }
            html += `<li>${inlineFormat(olMatch[2])}</li>`;
            continue;
        }

        // Table passthrough (already processed)
        if (line.startsWith('<table') || line.startsWith('<thead') || line.startsWith('<tbody') || line.startsWith('<tr') || line.startsWith('</')) {
            if (inList) { html += `</${listType}>`; inList = false; }
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            html += line;
            continue;
        }

        // Empty line
        if (line.trim() === '') {
            if (inList) { html += `</${listType}>`; inList = false; }
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            continue;
        }

        // Blockquote
        if (line.startsWith('> ')) {
            if (inList) { html += `</${listType}>`; inList = false; }
            if (inParagraph) { html += '</p>'; inParagraph = false; }
            html += `<blockquote><p>${inlineFormat(line.substring(2))}</p></blockquote>`;
            continue;
        }

        // Regular paragraph text
        if (inList) { html += `</${listType}>`; inList = false; }
        if (!inParagraph) {
            html += '<p>';
            inParagraph = true;
        } else {
            html += ' ';
        }
        html += inlineFormat(line);
    }

    if (inList) html += `</${listType}>`;
    if (inParagraph) html += '</p>';

    // Restore inline codes
    html = html.replace(/\x00INLINE(\d+)\x00/g, (_, idx) => inlineCodes[parseInt(idx)]);

    return html;
}

function inlineFormat(text) {
    // Bold + italic
    text = text.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Links
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // Inline code placeholders are preserved (restored after)
    return text;
}

// ─── README Loader ───────────────────────────────────────────
let readmeLoaded = false;
async function loadReadme() {
    if (readmeLoaded) return;
    const container = document.getElementById('readmeContent');
    try {
        const res = await fetch(`${BASE}/api/dashboard/readme`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        container.innerHTML = renderMarkdown(data.content);
        container.style.color = '';
        container.style.fontStyle = '';
        readmeLoaded = true;
    } catch (e) {
        container.textContent = 'Failed to load README: ' + e.message;
        container.style.color = 'var(--red)';
    }
}

// ─── Log Viewer ──────────────────────────────────────────────
let logPage = 1;

async function loadLogs() {
    const q = document.getElementById('logSearch').value;
    const level = document.getElementById('logLevel').value;
    const module = document.getElementById('logModule').value;

    const params = new URLSearchParams({ page: logPage, per_page: 100 });
    if (q) params.set('q', q);
    if (level) params.set('level', level);
    if (module) params.set('module', module);

    try {
        const res = await fetch(`${BASE}/api/logs?${params}`);
        const data = await res.json();

        const body = document.getElementById('logBody');
        body.innerHTML = data.lines.map(entry => {
            const ts = entry.timestamp || '';
            const time = ts.includes('T') ? ts.split('T')[1]?.substring(0, 8) : ts.substring(11, 19);
            const date = ts.substring(0, 10);
            const dataStr = entry.data ? JSON.stringify(entry.data) : '';
            return `<tr>
                <td title="${date}">${time}</td>
                <td><span class="log-level ${entry.level || ''}">${entry.level || ''}</span></td>
                <td>${entry.module || ''}</td>
                <td>${entry.event || ''}</td>
                <td class="log-data" onclick="this.classList.toggle('expanded')" title="Click to expand">${escapeHtml(dataStr)}</td>
            </tr>`;
        }).join('');

        // Pagination
        const totalPages = Math.ceil(data.total / data.perPage);
        const pag = document.getElementById('logPagination');
        pag.innerHTML = `
            <button onclick="logPage=1;loadLogs()" ${logPage<=1?'disabled':''}>First</button>
            <button onclick="logPage--;loadLogs()" ${logPage<=1?'disabled':''}>Prev</button>
            <span>Page ${logPage} of ${totalPages} (${data.total} entries)</span>
            <button onclick="logPage++;loadLogs()" ${logPage>=totalPages?'disabled':''}>Next</button>
            <button onclick="logPage=${totalPages};loadLogs()" ${logPage>=totalPages?'disabled':''}>Last</button>
        `;

        // Load stats + modules on first load
        loadLogStats();
    } catch (e) {
        console.error('Log load error:', e);
    }
}

async function loadLogStats() {
    try {
        const res = await fetch(`${BASE}/api/logs/stats`);
        const data = await res.json();

        document.getElementById('logStats').innerHTML =
            Object.entries(data.level_counts || {}).map(([k, v]) =>
                `<span class="log-stat-badge"><span class="log-level ${k}">${k}</span> ${v}</span>`
            ).join('') + `<span class="log-stat-badge">Total: ${data.total}</span>`;

        const modSelect = document.getElementById('logModule');
        const current = modSelect.value;
        modSelect.innerHTML = '<option value="">All</option>' +
            (data.modules || []).map(m => `<option value="${m}" ${m===current?'selected':''}>${m}</option>`).join('');
    } catch (e) {}
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// Debounced log search
let logSearchTimer;
document.getElementById('logSearch').addEventListener('input', () => {
    clearTimeout(logSearchTimer);
    logSearchTimer = setTimeout(() => { logPage = 1; loadLogs(); }, 300);
});
document.getElementById('logLevel').addEventListener('change', () => { logPage = 1; loadLogs(); });
document.getElementById('logModule').addEventListener('change', () => { logPage = 1; loadLogs(); });

// ─── Init ────────────────────────────────────────────────────
renderCommands();
</script>
</body>
</html>
